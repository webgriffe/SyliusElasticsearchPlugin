imports:
    - { resource: "@WebgriffeSyliusElasticsearchPlugin/config/config.php" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Webgriffe\SyliusElasticsearchPlugin

sylius_product:
    resources:
        product:
            classes:
                repository: Tests\Webgriffe\SyliusElasticsearchPlugin\Doctrine\ORM\ProductRepository
        product_option:
            classes:
                model: Tests\Webgriffe\SyliusElasticsearchPlugin\Entity\Product\ProductOption

sylius_attribute:
    resources:
        product:
            attribute:
                classes:
                    model: Tests\Webgriffe\SyliusElasticsearchPlugin\Entity\Product\ProductAttribute
